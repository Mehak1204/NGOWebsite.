<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be a Member - EK Sahyog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            scroll-behavior: smooth;
        }

        header {
            background: black;
            color: #fff;
            padding: 12px 0;
        }

        header .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 11px;
            margin: 0 10px;
        }

        nav a:hover {
            color: #e74c3c;
        }


        footer {
            background: #1a1a1a;
            text-align: left;
            padding: 20px 0;
        }

        .container {
            margin-top: 51px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form input,
        form textarea {
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        form button {
            background: #e74c3c;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        form button:hover {
            background: #d63b2b;
        }
    </style>
</head>

<body>


    <!-- Header -->
    <header>
        <nav class="container d-flex justify-content-between align-items-center">
            <div class="logo">Ek Sahyog</div>
            <ul class="d-flex list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="member.html">Be a Member</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="help.html">Request Help</a></li>
                <li><a href="government-policies.html">Government Policies</a></li>
            </ul>
        </nav>
    </header>
    <!-- Be a Member Section -->
    <div class="container text-center">
        <h2>Join Us as a Member</h2>
        <p>Become a part of Ek Sahyog and help us make a lasting impact.</p>
        <form action="your-backend-url" method="POST">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Why do you want to join?" required></textarea>
            <button type="submit">Join Now</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
