<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Help - Ek Sahyog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
        }

        header {
            background: black;
            color: #fff;
            padding: 15px 0;
        }
        header .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav a {
            color: orange;
            text-decoration: none;
            padding: 10px;
            margin: 0 10px;
        }

        nav a:hover {
            color: #e74c3c;
        }

        footer {
            background: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        .container {
            margin-top: 50px;
        }

        .help-section {
            padding: 50px 0;
        }

        .help-section h2 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 30px;
        }

        .help-form input,
        .help-form textarea {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            border: none;
        }

        .help-form button {
            background-color: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 18px;
        }

        .help-form button:hover {
            background-color: #d63b2b;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="container d-flex justify-content-between align-items-center">
            <div class="logo">Ek Sahyog</div>
            <ul class="d-flex list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="member.html">Be a Member</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="help.html">Request Help</a></li>
                <li><a href="government-policies.html">Government Policies</a></li>
            </ul>
        </nav>
    </header>

    <!-- Help Section -->
    <section class="help-section">
        <div class="container">
            <h2>Request Help</h2>
            <p>If you need assistance or support from Ek Sahyog, please fill out the form below, and we will get back to you as soon as possible.</p>
            <div class="help-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Phone Number" required>
                <textarea placeholder="Describe your need for help" required></textarea>
                <button type="submit">Submit Request</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Ek Sahyog. All rights reserved.</p>
    </footer>

</body>

</html>
